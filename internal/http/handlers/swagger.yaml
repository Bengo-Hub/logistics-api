openapi: 3.0.0
info:
  title: Logistics Service API
  description: HTTP API for the Codevertex logistics service. Provides fleet management, task assignment, routing, and delivery tracking.
  version: 0.1.0
  contact:
    name: Codevertex Support
servers:
  - url: https://logistics.codevertex.local
    description: Local development server (HTTPS)
  - url: https://logisticsapi.codevertexafrica.com
    description: Production server
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Service liveness probe
      description: Returns OK when the logistics API process is running.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: logistics-service
  /readyz:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Validates connectivity to Postgres, Redis, and NATS backends.
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service dependencies unavailable
  /metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics
      description: Exposes Prometheus metrics for scraping.
      responses:
        '200':
          description: Prometheus metrics payload
  /v1/{tenant}/tasks:
    get:
      tags:
        - Tasks
      summary: List delivery tasks
      description: Returns a list of delivery tasks for the specified tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
      responses:
        '200':
          description: List of delivery tasks
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /v1/{tenant}/fleet/members:
    get:
      tags:
        - Fleet
      summary: List fleet members
      description: Returns a list of fleet members (drivers/riders) for the specified tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
      responses:
        '200':
          description: List of fleet members
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /v1/{tenant}/routes/{routeId}:
    get:
      tags:
        - Routes
      summary: Get route details
      description: Returns details for a specific route.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: routeId
          in: path
          required: true
          schema:
            type: string
          description: Route identifier
      responses:
        '200':
          description: Route details
        '401':
          description: Unauthorized
        '404':
          description: Route not found
        '500':
          description: Internal server error
  /api/v1/{tenant}/zones:
    get:
      tags: [Zones]
      summary: List delivery zones
      description: All service areas of the tenant with their delivery settings, including drafts and admin notes. Requires logistics.zones.view. Scoped to the outlet in outlet_id, else the outlet in X-Outlet-ID; areas with no outlet scope serve every outlet.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: outlet_id
          in: query
          schema:
            type: string
          description: Only zones serving this outlet
      responses:
        '200':
          description: Zones
    post:
      tags: [Zones]
      summary: Create a delivery zone
      description: "Circle uses settings.center and settings.radius_m. Polygon uses boundary as [[lng,lat],...]. Requires logistics.zones.manage."
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        '201':
          description: Created
        '400':
          description: Invalid geometry or settings
        '409':
          description: Name already used
  /api/v1/{tenant}/zones/{zoneId}:
    patch:
      tags: [Zones]
      summary: Update a delivery zone
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
    delete:
      tags: [Zones]
      summary: Delete a delivery zone
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /api/v1/{tenant}/zones/coverage:
    get:
      tags: [Zones]
      summary: Public delivery coverage
      description: Active zones, outlets, bounds and centre for customer maps. Public, throttled per IP.
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: outlet_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Coverage
  /api/v1/{tenant}/zones/quote:
    get:
      tags: [Zones]
      summary: Delivery quote for a location
      description: Public. Serviceable flag, fee, method, matched or nearest area, distance and ETA. The fee is authoritative. A pin outside every area is still delivered (per-km price) while it is no further from the outlet than the furthest area's far edge plus buffer_km, unless the policy coverage is "buffer". outlet_id falls back to X-Outlet-ID, then the nearest outlet.
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: outlet_id
          in: query
          schema:
            type: string
        - name: order_total
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
  /api/v1/{tenant}/zones/outlets/refresh:
    post:
      tags: [Zones]
      summary: Pull the tenant's outlets and map pins from auth-api now
      description: auth-api owns outlets and their pins. After a pin is saved there this refreshes logistics' mirror at once and drops cached quotes. Requires logistics.zones.manage.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
      responses:
        '200':
          description: Number of outlets updated
  /api/v1/{tenant}/delivery-policy/suggest-fee:
    get:
      tags: [Zones]
      summary: Suggest the delivery fee of a new area
      description: Prices an area centred on a point from the dispatching outlet with the tenant's per-km rules (base fee, rate, minimum, rounding, distance source). Returns the fee at the centre and at the near and far edges. Requires logistics.zones.manage.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius_m
          in: query
          schema:
            type: number
        - name: outlet_id
          in: query
          schema:
            type: string
          description: Dispatching outlet, else X-Outlet-ID, else the nearest with a map location
      responses:
        '200':
          description: Suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeSuggestion'
  /api/v1/{tenant}/delivery-policy:
    get:
      tags: [Zones]
      summary: Delivery quote policy
      description: Per-km fallback, coverage rule, geofence buffer, maximum radius, rounding, distance source and customer confirmation. Requires logistics.zones.view.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
      responses:
        '200':
          description: Policy and its source (tenant, platform or default)
    put:
      tags: [Zones]
      summary: Save the delivery quote policy
      description: Requires logistics.pricing.manage.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
      responses:
        '200':
          description: Saved
  /api/v1/{tenant}/routing/geocode/search:
    get:
      tags: [Routing]
      summary: Search places
      description: Tenant delivery areas first, then geocoder results biased to the coverage. Public, throttled per IP.
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Places
  /api/v1/{tenant}/routing/geocode/reverse:
    get:
      tags: [Routing]
      summary: Name the place at a location
      description: Place name plus the delivery area it falls in or is nearest to. Public, throttled per IP.
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Place
  /api/v1/{tenant}/analytics/zones:
    get:
      tags: [Analytics]
      summary: Deliveries by zone
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          description: Tenant slug
        - name: period
          in: query
          schema:
            type: string
            enum: [today, 7d, 30d, 90d]
      responses:
        '200':
          description: Per-zone counts, fees, distance and timing
  /api/v1/s2s/zones/{tenant}/quote:
    post:
      tags: [S2S]
      summary: Delivery quote (service-to-service)
      description: Authoritative quote for checkout in ordering, pos and other services. Tenant may be a UUID or slug.
      security:
        - serviceKey: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: {type: number}
                lng: {type: number}
                outlet_id: {type: string}
                order_total: {type: number}
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
  /api/v1/s2s/zones/{tenant}/coverage:
    get:
      tags: [S2S]
      summary: Delivery coverage (service-to-service)
      security:
        - serviceKey: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coverage
  /api/v1/s2s/dispatch/{tenant}/riders:
    get:
      tags: [S2S]
      summary: Active riders (service-to-service)
      description: Slim rider view (id, name, phone, employment) for another service's rider picker; no KYC data. Tenant is a UUID.
      security:
        - serviceKey: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "{data: [{id, first_name, last_name, phone, employment}]}"
  /api/v1/{tenant}/analytics/kpis:
    get:
      tags: [Analytics]
      summary: Delivery and fleet KPIs
      description: Needs logistics.tasks.view and the driver_analytics or performance_reports feature. Periods are calendar days in REPORTS_TIMEZONE (default Africa/Nairobi).
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: period, in: query, schema: {type: string, enum: [today, 7d, 30d, 90d]}}
      responses:
        '200':
          description: Counts by outcome, on-time share, average delivery time, active riders, riders who worked and utilization
  /api/v1/{tenant}/analytics/series:
    get:
      tags: [Analytics]
      summary: Deliveries over time
      description: Task outcomes per hour (today) or per day, empty buckets filled.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: period, in: query, schema: {type: string, enum: [today, 7d, 30d, 90d]}}
      responses:
        '200':
          description: "{period, unit: hour|day, points: [{start, total, delivered, failed, cancelled}]}"
  /api/v1/{tenant}/analytics/riders:
    get:
      tags: [Analytics]
      summary: Rider performance
      description: Per rider jobs, deliveries, failures, average delivery time, on-time share and rating; top 50 by deliveries.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: period, in: query, schema: {type: string, enum: [today, 7d, 30d, 90d]}}
      responses:
        '200':
          description: Array of rider stats
  /api/v1/{tenant}/fleet/members/onboard:
    post:
      tags: [Fleet]
      summary: Add an internal rider directly
      description: >-
        Needs logistics.fleet.manage and rider_management. Creates or finds the rider's SSO account in
        auth-api (a new one gets a temporary password that must be changed on first sign-in), then an
        active staff rider with the pay basis and an optional vehicle. ID number is required; ID and photo
        uploads are optional. send_invite emails the sign-in details. The response carries temp_password
        once (no-store) for the admin to hand over.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, email, phone, id_number]
              properties:
                first_name: {type: string}
                last_name: {type: string}
                email: {type: string, format: email}
                phone: {type: string}
                id_number: {type: string}
                license_no: {type: string}
                pay_basis: {type: string, enum: [payroll, earning_rules], default: payroll}
                vehicle_id: {type: string, format: uuid, description: Link a free fleet vehicle}
                vehicle:
                  type: object
                  description: Register a new vehicle (not with vehicle_id)
                  required: [vehicle_type, license_plate]
                  properties:
                    vehicle_type: {type: string, description: "motorcycle, bicycle, car, van, truck or other (bike and motorbike are accepted)"}
                    make: {type: string}
                    model: {type: string}
                    license_plate: {type: string}
                send_invite: {type: boolean}
      responses:
        '201': {description: "Rider, plus temp_password (new accounts only), existing_account and email_sent"}
        '400': {description: Missing or invalid details}
        '409': {description: Already a rider, plate or vehicle taken, or the account rides for another business}
        '502': {description: auth-api could not create the account; nothing was saved}
  /api/v1/{tenant}/fleet/vehicles:
    get:
      tags: [Fleet]
      summary: List fleet vehicles
      description: Needs logistics.fleet.view. Every vehicle, linked or free, with assigned_to, plus a fleet-wide summary counted in SQL.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}, description: Plate, make or model}
        - {name: status, in: query, schema: {type: string, enum: [active, maintenance, inactive]}}
        - {name: assigned, in: query, schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200': {description: "{data, total, page, limit, hasMore, summary: {active, maintenance, inactive, assigned, unassigned}}"}
  /api/v1/{tenant}/fleet/vehicles/{vehicleId}/insurance:
    put:
      tags: [Fleet]
      summary: Record or renew a vehicle's insurance
      description: Needs logistics.fleet.manage. A vehicle deactivated for expired insurance is reactivated; the previous policy is kept in a short history. An already expired policy is refused.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: vehicleId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InsuranceInput'}
      responses:
        '200': {description: "Vehicle with its insurance view (status valid | expiring | expired | missing | not_required, days_left, block)"}
        '400': {description: Missing policy number or expiry, bad dates, or an expired policy}
        '404': {description: Vehicle not found}
  /api/v1/{tenant}/riders/me/vehicle/insurance:
    put:
      tags: [Riders]
      summary: The rider renews their vehicle's insurance
      description: The vehicle linked to the signed-in rider. Same rules as the admin route.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InsuranceInput'}
      responses:
        '200': {description: Vehicle with its insurance view}
        '404': {description: No vehicle linked to the rider}
  /api/v1/{tenant}/settings/{key}:
    delete:
      tags: [Settings]
      summary: Return a setting to the platform default
      description: Needs logistics.config.manage. Removes the tenant's own value of the key.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: key, in: path, required: true, schema: {type: string}, example: logistics.block_expired_insurance}
      responses:
        '204': {description: Tenant value removed}
  /api/v1/{tenant}/fleet/members/{memberId}/vehicle:
    post:
      tags: [Fleet]
      summary: Link or unlink a rider's vehicle
      description: Needs logistics.fleet.manage. An empty vehicle_id unlinks. Both rows must belong to the tenant and a vehicle has one rider at a time.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id: {type: string}
      responses:
        '200': {description: "{status: assigned | unassigned}"}
        '404': {description: Rider or vehicle not found}
        '409': {description: Vehicle linked to another rider}
  /api/v1/{tenant}/shifts:
    get:
      tags: [Shifts]
      summary: Shift schedule
      description: Needs logistics.fleet.view and the rider_shifts feature. Shifts overlapping [from, to] when given.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [scheduled, active, completed, cancelled]}}
        - {name: fleet_member_id, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200':
          description: "{data: [shift with rider_name], total}"
    post:
      tags: [Shifts]
      summary: Schedule a shift
      description: Needs logistics.tasks.manage (dispatchers, not riders) and rider_shifts. Active riders only; one rider's shifts cannot overlap; at most 24 hours.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fleet_member_id, shift_start, shift_end]
              properties:
                fleet_member_id: {type: string, format: uuid}
                shift_start: {type: string, format: date-time}
                shift_end: {type: string, format: date-time}
                zone_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '201': {description: Shift}
        '400': {description: Invalid times or inactive rider}
        '409': {description: Overlaps another shift of the rider}
  /api/v1/{tenant}/shifts/{shiftId}/{action}:
    post:
      tags: [Shifts]
      summary: Start, end or cancel a shift
      description: start (scheduled to active), end (active to completed, early end recorded), cancel (scheduled to cancelled). DELETE /shifts/{shiftId} removes a shift that never ran.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: shiftId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [start, end, cancel]}}
      responses:
        '200': {description: Shift}
        '409': {description: Not allowed from the current status}
  /api/v1/{tenant}/riders/me/shift:
    get:
      tags: [Rider]
      summary: The rider's shift (online when active)
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: "{online, shift, next_shift}"
  /api/v1/{tenant}/riders/me/shift/{state}:
    post:
      tags: [Rider]
      summary: Go online or offline
      description: online starts the scheduled shift (from 30 minutes before) or an open-ended one; offline ends it now and drops the rider from auto-dispatch at once.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: state, in: path, required: true, schema: {type: string, enum: [online, offline]}}
      responses:
        '200': {description: "{online, shift, next_shift}"}
        '403': {description: rider_not_active}
  /api/v1/{tenant}/riders/me/notifications:
    get:
      tags: [Rider]
      summary: The rider's inbox
      description: The signed-in rider's own messages (job assigned, moved, cancelled, payout sent). PATCH /{id}/read and POST /mark-all-read mark them read; GET /stream (WebSocket, ?token=) pushes new ones.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: include_read, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: "{data, total, unread}"
  /api/v1/{tenant}/riders/me/payout-method:
    get:
      tags: [Rider]
      summary: Where the rider is paid
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Payout method (account numbers masked)}
    put:
      tags: [Rider]
      summary: Set where the rider is paid
      description: M-Pesa needs a valid phone (normalised to 254...); bank needs bank code and account number. GET|PUT /riders/{riderID}/payout-method does the same for another rider with logistics.earnings.manage.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payout_method]
              properties:
                payout_method: {type: string, enum: [mpesa_b2c, paystack_bank, paystack_mobile, cash, internal_wallet]}
                payout_phone: {type: string}
                payout_bank_code: {type: string}
                account_number: {type: string}
                account_name: {type: string}
      responses:
        '200': {description: Payout method}
        '400': {description: Missing or invalid details for the method}
  /api/v1/{tenant}/earnings/statements/{statementID}/settle:
    post:
      tags: [Earnings]
      summary: Pay a statement
      description: Needs logistics.earnings.manage and the rider_payouts feature. Sends a real payout through treasury; the statement is claimed (draft to processing) first, so it cannot be paid twice.
      security:
        - bearerAuth: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: statementID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "{statement_id, status: processing, payout_reference}"}
        '409': {description: Already being paid or not a draft}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token from auth-service. Format: Bearer {token}"
    serviceKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    InsuranceInput:
      type: object
      required: [policy_no, expires_on]
      properties:
        policy_no: {type: string, example: 030/071/1/000255/2026/03}
        certificate_no: {type: string, example: D5337693}
        insurer: {type: string}
        cover: {type: string, example: COMP}
        starts_on: {type: string, format: date}
        expires_on: {type: string, format: date, description: Last day of cover (local date)}
        document: {type: string, description: Uploaded certificate reference}
    FeeSuggestion:
      type: object
      properties:
        outlet: {type: object, properties: {id: {type: string}, name: {type: string}}}
        distance_km: {type: number, description: Distance from the outlet to the area centre}
        distance_type: {type: string, enum: [road, estimated, straight]}
        near_km: {type: number}
        far_km: {type: number}
        suggested_fee: {type: number, description: Per-km fee at the area centre}
        near_fee: {type: number}
        far_fee: {type: number}
        outlet_inside: {type: boolean, description: The outlet sits inside the area, where delivery is normally free}
        currency: {type: string}
        reason: {type: string, description: no_outlet_location when no outlet has a map pin}
    ZoneSettings:
      type: object
      properties:
        shape: {type: string, enum: [circle, polygon]}
        center:
          type: object
          properties:
            lat: {type: number}
            lng: {type: number}
        radius_m: {type: number}
        fee: {type: number}
        free: {type: boolean}
        currency: {type: string}
        min_order: {type: number}
        eta_minutes: {type: integer}
        priority: {type: integer, description: Higher wins when zones overlap and ties go to the smaller zone}
        outlet_ids: {type: array, items: {type: string}}
        aliases: {type: array, items: {type: string}}
        notes: {type: string}
    ZoneInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
        zone_type: {type: string, enum: [delivery, exclusion, pickup, surge]}
        status: {type: string, enum: [active, inactive, draft]}
        color: {type: string}
        boundary: {type: array, items: {type: array, items: {type: number}}}
        settings: {$ref: '#/components/schemas/ZoneSettings'}
    Quote:
      type: object
      properties:
        serviceable: {type: boolean}
        reason: {type: string, enum: [excluded_area, outside_delivery_area, beyond_max_radius, no_outlet_location, no_delivery_coverage, invalid_location]}
        method: {type: string, enum: [zone, per_km]}
        fee: {type: number}
        free: {type: boolean}
        currency: {type: string}
        zone: {type: object, properties: {id: {type: string}, name: {type: string}}}
        nearest_area: {type: object, properties: {id: {type: string}, name: {type: string}}}
        nearest_area_km: {type: number}
        furthest_area: {type: object, properties: {id: {type: string}, name: {type: string}}, description: The area reaching furthest from the outlet}
        furthest_area_km: {type: number, description: Straight-line distance from the outlet to the furthest area's far edge}
        outlet_km: {type: number, description: Straight-line distance from the outlet to the pin}
        needs_confirmation: {type: boolean, description: Distance-priced delivery whose area, distance and fee are sent to the customer with the order confirmation}
        distance_km: {type: number}
        distance_type: {type: string, enum: [road, estimated, straight]}
        eta_minutes: {type: integer}
        min_order: {type: number}
        below_min_order: {type: boolean}
        policy_version: {type: string}
        cache_seconds: {type: integer}
